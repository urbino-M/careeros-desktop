name: Branch preview

on:
  push:
    branches:
      - internship-sidebar-parallel
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-preview
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build preview
        env:
          VITE_BASE: ./
        run: pnpm build

      - name: Upload branch preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: postdocos-branch-preview
          path: dist
          if-no-files-found: error
          retention-days: 14
