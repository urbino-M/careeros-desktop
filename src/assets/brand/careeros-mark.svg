<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-labelledby="title">
  <title id="title">CareerOS navigation mark</title>
  <defs>
    <linearGradient id="ring" x1="180" y1="130" x2="760" y2="870" gradientUnits="userSpaceOnUse">
      <stop stop-color="#63d6d1"/>
      <stop offset="0.52" stop-color="#25aeb9"/>
      <stop offset="1" stop-color="#08778c"/>
    </linearGradient>
    <linearGradient id="plane-top" x1="330" y1="520" x2="825" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#55d3ce"/>
      <stop offset="1" stop-color="#1ca5b3"/>
    </linearGradient>
    <linearGradient id="plane-fold" x1="560" y1="560" x2="710" y2="720" gradientUnits="userSpaceOnUse">
      <stop stop-color="#168fa4"/>
      <stop offset="1" stop-color="#075d75"/>
    </linearGradient>
    <mask id="open-c" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
      <rect width="1024" height="1024" fill="white"/>
      <path d="M512 512 986 212v600Z" fill="black"/>
    </mask>
  </defs>
  <circle cx="512" cy="512" r="343" fill="none" stroke="url(#ring)" stroke-width="150" mask="url(#open-c)"/>
  <path d="m320 514 500-174-260 225Z" fill="url(#plane-top)"/>
  <path d="m560 565 260-225-200 370Z" fill="url(#plane-fold)"/>
</svg>
