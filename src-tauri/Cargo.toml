[package]
name = "postdocos"
version = "0.1.0"
description = "CareerOS native desktop application"
authors = ["Hongbo Miao"]
license = "MIT"
edition = "2024"
rust-version = "1.85"

[lib]
name = "postdocos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "CareerOS"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "multipart", "rustls-tls"] }
regex = "1"
rusqlite = { version = "0.37", features = ["bundled", "backup", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "process", "rt-multi-thread", "sync", "time", "io-util", "net"] }
toml = "0.9"
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
lopdf = "0.38"

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
